name: Deploy Web Build

on:
  push:
    branches: [main]
    # Store art and docs do not rebuild the game. CHANGELOG.md does, since the game shows the version it
    # names.
    paths: ["**", "!store/**", "!assets/store/**", "!**.md", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # The org variable RUNNER moves the build onto a self-hosted runner, to save the plan's minutes.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      GODOT_RELEASE: "4.7-stable"
      GODOT_VERSION: "4.7.stable"
    steps:
      - uses: actions/checkout@v4

      # The Web preset exports with the trimmed engine in kit/web (no 3D, physics or unused modules), so
      # Godot's 1.26 GB template bundle is never downloaded.
      - name: Install Godot
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          wget -qO godot.zip "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          bin="$PWD/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          test -f kit/web/godot.web.template_release.wasm32.nothreads.zip

      # Two passes: the first builds .godot/ from a bare checkout and logs font errors because the theme
      # loads the font before the scan has imported it. The second must be clean, and the font asserted.
      - name: Import resources
        run: |
          set -e
          "$GODOT_BIN" --headless --import > /dev/null 2>&1 || true
          "$GODOT_BIN" --headless --import
          ls .godot/imported/Outfit-Medium.ttf-*.fontdata .godot/imported/Outfit-Light.ttf-*.fontdata

      - name: Export Web build
        run: |
          set -e
          mkdir -p build/web
          "$GODOT_BIN" --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # The game reads its version from CHANGELOG.md, so the file itself must be in the pack.
          python3 -c "import sys; sys.exit(open('CHANGELOG.md', 'rb').read() not in open('build/web/index.pck', 'rb').read())"
          grep -q "roll every marble home" build/web/index.html

      - name: Copy the loading page's font, icons and Google Play gate
        run: |
          set -e
          cp web/Outfit-Light.ttf web/favicon.ico web/favicon-16.png web/favicon-32.png web/favicon-48.png \
             web/apple-touch-icon-180.png web/icon-192.png web/icon-512.png web/gate.js build/web/

      - name: Deploy to chaosmos.studio/plumb/play/
        uses: chaosmos-studio/.github/actions/deploy-web@main
        with:
          worker: plumb-play
          paths: plumb/play=build/web
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
