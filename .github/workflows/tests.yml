name: Tests

# Every push to main runs the whole suite, which re-solves every shipped level, and the smoke robot, which
# plays some through the real screens. The web and Android builds do not wait for it, so they come out in
# minutes; a red run here is looked into on its own, and a release is cut from a commit that passed.
on:
  push:
    branches: [main]
    paths: ["**", "!store/**", "!assets/store/**", "!**.md", "CHANGELOG.md"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_RELEASE: "4.7-stable"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -e
          wget -qO godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          bin="$PWD/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      # Two passes: the first builds .godot/ from a bare checkout and logs font errors because the theme
      # loads the font before the scan has imported it. The second must be clean.
      - name: Import resources
        run: |
          set -e
          "$GODOT_BIN" --headless --import > /dev/null 2>&1 || true
          "$GODOT_BIN" --headless --import

      - name: Run tests
        run: |
          set -e
          out="$("$GODOT_BIN" --headless -s res://tests/run_tests.gd 2>&1)"
          echo "$out"
          echo "$out" | grep -q " 0 failed"

      - name: Smoke robot
        run: |
          set -e
          smoke="$(timeout 300 "$GODOT_BIN" --headless res://tools/smoke.tscn 2>&1)"
          echo "$smoke"
          echo "$smoke" | grep -q "SMOKE_OK"
