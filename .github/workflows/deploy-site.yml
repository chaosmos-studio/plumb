name: Deploy Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and index
        run: npm run build
        env:
          SITE: https://chaosmos.studio
          BASE_PATH: /plumb/

      - name: Check SEO basics on every page
        run: npm run check

      # The studio site's public repo serves chaosmos.studio. The website owns plumb/, and the web build
      # under plumb/play/ comes from the other workflow, so this deploy leaves it alone.
      - name: Deploy to chaosmos.studio/plumb/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: main
          folder: website/dist
          target-folder: plumb
          clean-exclude: play
          force: false
          attempt-limit: 10
          commit-message: Update Plumb's website
