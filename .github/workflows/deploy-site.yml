name: Deploy Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Shares the gh-pages queue with the game's web deploy.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and index
        run: npm run build
        env:
          SITE: https://shravangoswami.com
          BASE_PATH: /plumb/

      - name: Check SEO basics on every page
        run: npm run check

      # The site replaces the root of gh-pages, so it carries the game's current web build along.
      # git ls-tree and git archive read paths from the working directory, so this runs at the repo root.
      - name: Keep the web build under play/
        working-directory: .
        run: |
          set -e
          touch website/dist/.nojekyll
          git fetch --depth 1 origin gh-pages || exit 0
          if git ls-tree -d --name-only origin/gh-pages play | grep -q play; then
            git archive origin/gh-pages play | tar -x -C website/dist
          fi
          test -d website/dist/play && echo "kept play/" || echo "no play/ on gh-pages yet"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          keep_files: false
